# nginx reverse-proxy template for the TRIAS proxy.
# Filled in and installed by ../setup.sh --domain <domain> — placeholders
# (__DOMAIN__, __PORT__, __TILES_PORT__, __STYLES_DIR__) are substituted there. The block
# between "BEGIN tiles" / "END tiles" is removed when setup.sh runs with
# --skip-tiles.
#
# This only sets up plain HTTP. Run `sudo certbot --nginx -d __DOMAIN__`
# afterwards to add TLS (certbot rewrites this file to add the HTTPS block
# and redirect).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # BEGIN tiles
    # Vector tiles (PMTiles server): /tiles/<name>/{z}/{x}/{y}.mvt
    # The trailing slash on proxy_pass strips the /tiles/ prefix.
    location /tiles/ {
        proxy_pass http://127.0.0.1:__TILES_PORT__/;
        proxy_set_header Host $host;
    }

    # Map style JSONs generated by deploy/styles/generate_styles.py:
    # /styles/light.json, /styles/dark.json
    location /styles/ {
        alias __STYLES_DIR__/;
        add_header Access-Control-Allow-Origin "*";
    }
    # END tiles

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
