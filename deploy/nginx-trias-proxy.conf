# nginx reverse-proxy template for the TRIAS proxy.
# Filled in and installed by ../setup.sh --domain <domain> — placeholders
# (__DOMAIN__, __PORT__) are substituted there.
#
# This only sets up plain HTTP. Run `sudo certbot --nginx -d __DOMAIN__`
# afterwards to add TLS (certbot rewrites this file to add the HTTPS block
# and redirect).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
