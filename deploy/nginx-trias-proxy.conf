# nginx template: serves the Flutter web client and reverse-proxies the TRIAS
# proxy and the tile server, all on one origin (port 80, later 443).
#
#   /          Flutter web build (__WEB_DIR__)
#   /api/      TRIAS proxy (uvicorn on 127.0.0.1:__PORT__)
#   /tiles/    PMTiles server
#   /styles/   map style JSONs
#
# Filled in and installed by ../setup.sh --domain <domain> — placeholders
# (__DOMAIN__, __PORT__, __TILES_PORT__, __STYLES_DIR__, __WEB_DIR__) are
# substituted there. The block between "BEGIN tiles" / "END tiles" is removed
# when setup.sh runs with --skip-tiles.
#
# This only sets up plain HTTP. Run `sudo certbot --nginx -d __DOMAIN__`
# afterwards to add TLS (certbot rewrites this file to add the HTTPS block
# and redirect).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # BEGIN tiles
    # Vector tiles (PMTiles server): /tiles/<name>/{z}/{x}/{y}.mvt
    # The trailing slash on proxy_pass strips the /tiles/ prefix.
    location /tiles/ {
        proxy_pass http://127.0.0.1:__TILES_PORT__/;
        proxy_set_header Host $host;
    }

    # Map style JSONs generated by deploy/styles/generate_styles.py:
    # /styles/light.json, /styles/dark.json
    location /styles/ {
        alias __STYLES_DIR__/;
        add_header Access-Control-Allow-Origin "*";
    }
    # END tiles

    # TRIAS proxy API: /api/stops/bbox -> http://127.0.0.1:__PORT__/stops/bbox
    # The trailing slash on proxy_pass strips the /api/ prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flutter web client (flutter build web). Asset file names aren't
    # content-hashed, so the entry points must be revalidated on every load,
    # otherwise browsers keep running an old build after a deploy.
    root __WEB_DIR__;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.(js|wasm|mjs)|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }
}
